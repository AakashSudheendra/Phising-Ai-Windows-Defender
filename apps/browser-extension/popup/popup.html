<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard Security</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="Logo" class="brand-icon">
        <div class="brand-text">
          <span class="brand-title">PhishGuard<span class="accent">Security</span></span>
          <span class="brand-sub">Endpoint Protection</span>
        </div>
      </div>
      <div class="service-pill" id="service-pill">
        <span class="pill-dot" id="pill-dot"></span>
        <span class="pill-text" id="pill-text">Checking...</span>
      </div>
    </header>

    <!-- Main Protection Card -->
    <div class="status-card">
      <div class="status-row">
        <div>
          <div class="status-title" id="protection-status-title">Real-Time Protection</div>
          <div class="status-desc" id="protection-status-desc">Active pre-navigation defense</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-protection" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Current Tab Status -->
    <div class="current-site-box">
      <div class="site-header">Current Tab</div>
      <div class="site-url" id="site-url">Loading active tab...</div>
      <div class="site-verdict" id="site-verdict">
        <span class="verdict-dot safe"></span>
        <span class="verdict-label" id="verdict-label">Scanning...</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="popup-actions">
      <button class="btn btn-primary" id="btn-open-dashboard">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        Open Desktop Dashboard
      </button>

      <button class="btn btn-secondary" id="btn-report-site">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>
        </svg>
        Report Incorrect Result
      </button>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>Offline detection • v1.0.0</span>
      <a href="http://127.0.0.1:8765" target="_blank" class="footer-link">Web Demo</a>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
